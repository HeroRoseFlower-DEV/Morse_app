name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    # این دستور تمام پردازش‌های جاوا (حتی مخفی‌ها) را مجبور می‌کند گرافیک را خاموش کنند
    env:
      JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Configure Gradle Properties
      # تزریق تنظیمات به فایل‌های پایه سیستم برای محدود کردن افزونه KSP
      run: |
        mkdir -p ~/.gradle
        echo "org.gradle.jvmargs=-Xmx2048m -Djava.awt.headless=true" >> ~/.gradle/gradle.properties
        echo "kotlin.daemon.jvmargs=-Djava.awt.headless=true" >> ~/.gradle/gradle.properties
        echo "kotlin.compiler.execution.strategy=in-process" >> ~/.gradle/gradle.properties

    - name: Create Mock google-services.json
      run: |
        mkdir -p app
        cat <<EOF > app/google-services.json
        {
          "project_info": {
            "project_number": "123456789012",
            "project_id": "mock-app",
            "storage_bucket": "mock-app.appspot.com"
          },
          "client": [
            {
              "client_info": {
                "mobilesdk_app_id": "1:123456789012:android:1234567890123456",
                "android_client_info": {
                  "package_name": "com.aistudio.morsetranslator.mrsxqz"
                }
              },
              "oauth_client": [],
              "api_key": [
                {
                  "current_key": "AIzaSyMockKeyForBuildingApkOnly"
                }
              ],
              "services": {}
            }
          ],
          "configuration_version": "1"
        }
        EOF

    - name: Generate Debug Keystore
      run: keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "C=US, O=Android, CN=Android Debug"

    - name: Ensure Gradle Wrapper exists
      run: gradle wrapper

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: Morse_app-APK
        path: app/build/outputs/apk/**/*.apk
