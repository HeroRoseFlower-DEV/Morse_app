name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch: # امکان اجرای دستی ورک‌فلو را می‌دهد

jobs:
  build:
    runs-on: ubuntu-latest
    
    # توجه: ANDROID_SDK_ROOT از اینجا حذف شده تا خطای Unrecognized named-value: 'runner' رخ ندهد.
    # این متغیر در مرحله نصب SDK تنظیم می‌شود.

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android command-line tools and SDK components
        run: |
          set -euo pipefail
          
          # استفاده از RUNNER_TEMP که همیشه در محیط شل اکشن‌ها معتبر است
          SDK_ROOT="${RUNNER_TEMP}/android-sdk"
          mkdir -p "$SDK_ROOT"
          
          # ذخیره در GITHUB_ENV برای دسترسی مراحل بعدی (مثلاً گریدل)
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV

          cd "$SDK_ROOT"

          # دانلود command-line tools لینوکس
          curl -sS -o cmdline-tools.zip "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
          unzip -q cmdline-tools.zip || (unzip cmdline-tools.zip -d .)

          mkdir -p cmdline-tools/latest
          # انتقال فایل‌های اکسترکت شده به ساختار استاندارد SDK
          mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true

          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          # نصب پکیج‌های ضروری (نسخه 36 تنظیم شده است، در صورت نیاز تغییر دهید)
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

          # تایید خودکار تمامی لایسنس‌های اندروید
          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses || true

          # اضافه کردن مسیرها به PATH گیت‌هاب
          echo "$SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

      - name: Setup Gradle Wrapper (Fallback)
        # اگر فایل gradlew در ریپازیتوری شما وجود نداشته باشد، این مرحله آن را خودکار می‌سازد
        run: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found in repository. Generating wrapper..."
            gradle wrapper --gradle-version 8.5
          else
            echo "gradlew found in repository. Skipping wrapper generation."
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Morse_app-APK
          path: app/build/outputs/apk/**/*.apk
